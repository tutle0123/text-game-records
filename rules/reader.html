<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>규칙서 읽기 | Text Game Records</title><link rel="stylesheet" href="../assets/site.css">
<style>
.reader-main{padding:43px clamp(20px,6vw,88px) 96px;max-width:1280px;margin:0 auto}
.reader-top{margin-bottom:26px}.reader-top h1{font-size:clamp(29px,3vw,41px);letter-spacing:-.06em;line-height:1.3;margin:10px 0 8px}.reader-top p{color:var(--muted);margin:0}
.reader-links{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.reader-links a{padding:9px 13px;border:1px solid var(--line);border-radius:7px;background:white;font-size:12px;font-weight:700;color:var(--text)}
.reader-links a.current{background:#21364d;color:white;border-color:#21364d}
.reader-layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;align-items:start;gap:25px}
.reader-content{min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(22px,4.1vw,47px);line-height:1.85;color:#314053;overflow-wrap:anywhere}
.reader-content h1{font-size:26px;letter-spacing:-.06em;line-height:1.4;margin:0 0 23px}
.reader-content h2{font-size:21px;letter-spacing:-.05em;line-height:1.4;padding-top:24px;margin:35px 0 14px;border-top:1px solid var(--line)}
.reader-content h3{font-size:17px;letter-spacing:-.035em;line-height:1.4;margin:23px 0 9px}
.reader-content h4{font-size:14px;margin:18px 0 8px}
.reader-content p{margin:11px 0}.reader-content blockquote{border-left:3px solid #638a82;background:#f0f5f2;padding:11px 17px;margin:17px 0;color:#506c65}
.reader-content ul,.reader-content ol{padding-left:26px;margin:9px 0 17px}.reader-content li{margin:7px 0}
.reader-content li ul{margin:5px 0}.reader-content hr{border:0;border-top:1px solid #dfe6eb;margin:30px 0}
.reader-content code{background:#eef2f5;color:#2f5f61;border-radius:3px;padding:2px 5px;font-size:.91em;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.reader-content pre{overflow:auto;padding:17px;background:#233246;color:#f0f5f5;border-radius:8px;white-space:pre-wrap;line-height:1.7;font-size:12px}
.reader-content pre code{background:transparent;color:inherit;padding:0}
.reader-content a{color:#276a64;text-decoration:underline;text-underline-offset:3px}
.reader-content table{border-collapse:collapse;display:block;overflow:auto;width:100%;font-size:12px;margin:14px 0 23px}
.reader-content th,.reader-content td{border:1px solid #dee5e9;text-align:left;min-width:95px;padding:9px 11px;vertical-align:top}
.reader-content th{background:#f2f6f7}
.reader-side{position:sticky;top:17px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:17px}
.reader-side strong{font-size:12px;display:block;margin-bottom:13px}
.reader-toc{display:grid;gap:4px;max-height:72vh;overflow:auto}
.reader-toc a{font-size:11px;color:#778594;padding:7px 9px;border-radius:5px}
.reader-toc a:hover{background:#f1f5f6;color:#1f5c58}
.reader-toc a.level-3{padding-left:17px}
.reader-error{padding:20px;background:#fff5f0;color:#92523b;border:1px solid #eed8cc;border-radius:8px}
@media(max-width:850px){.reader-layout{grid-template-columns:1fr}.reader-side{position:static;order:-1}.reader-toc{display:flex;flex-wrap:wrap;max-height:none}.reader-toc a{font-size:10px;padding:5px 7px}.reader-toc a.level-3{padding-left:7px}}
</style></head>
